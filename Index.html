<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Quieres ser mi novia?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px 50px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #e91e63;
            font-size: 2.2rem;
            margin-bottom: 40px;
            line-height: 1.3;
        }
        .botones {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            padding: 15px 40px;
            font-size: 1.4rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }
        #si {
            background: #4caf50;
            color: white;
        }
        #si:hover {
            background: #45a049;
            transform: scale(1.1);
        }
        #no {
            background: #f44336;
            color: white;
        }
        #no:hover {
            background: #d32f2f;
            transform: scale(1.1);
        }
        #respuesta-si {
            display: none;
            font-size: 2.8rem;
            color: #e91e63;
            font-weight: bold;
            animation: latido 0.8s infinite;
            text-align: center;
        }
        @keyframes latido {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        #screamer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        #screamer img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="container" id="pregunta">
        <h1>¿Quieres ser mi novia? 💕</h1>
        <div class="botones">
            <button id="si">SÍ</button>
            <button id="no">NO</button>
        </div>
    </div>

    <div id="respuesta-si">
        GRACIAS, TE AMO ❤️❤️❤️
    </div>

    <div id="screamer">
        <img src="https://upload.wikimedia.org/wikipedia/en/3/3b/Jeff_the_Killer_Original_edited_image.png" alt="Jeff the Killer">
    </div>

    <!-- Sonido de miedo fuerte -->
    <audio id="grito" preload="auto">
        <source src="https://orangefreesounds.com/wp-content/uploads/2026/10/Loud-male-scream-sound-effect.mp3" type="audio/mpeg">
    </audio>

    <script>
        const btnSi = document.getElementById('si');
        const btnNo = document.getElementById('no');
        const pregunta = document.getElementById('pregunta');
        const respuestaSi = document.getElementById('respuesta-si');
        const screamer = document.getElementById('screamer');
        const grito = document.getElementById('grito');

        btnSi.addEventListener('click', () => {
            pregunta.style.display = 'none';
            respuestaSi.style.display = 'block';
        });

        btnNo.addEventListener('click', () => {
            pregunta.style.display = 'none';
            screamer.style.display = 'flex';
            
            // Reproduce el grito lo más fuerte posible
            grito.volume = 1.0;
            grito.play().catch(e => console.log("Error al reproducir audio:", e));
            
            // Intenta poner pantalla completa
            if (screamer.requestFullscreen) {
                screamer.requestFullscreen().catch(err => console.log(err));
            } else if (screamer.webkitRequestFullscreen) {
                screamer.webkitRequestFullscreen();
            }
        });
    </script>
</body>
</html>
